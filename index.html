<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Memory Match Game</title>
    <style>
        /* --- General Styling --- */
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            margin-top: 0;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        /* --- NEW: Designer Credit at the Top --- */
        .designer-credit {
            margin-bottom: 25px;
            color: #888;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .designer-credit span {
            color: #ff00ff;
            font-weight: bold;
            text-shadow: 0 0 8px #ff00ff;
        }

        /* --- Stats Bar --- */
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .stat-box {
            background: #1a1a24;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            color: #00ffff;
            font-weight: bold;
        }

        /* --- Game Grid --- */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        /* --- Card Styling & 3D Flip --- */
        .card {
            width: 80px;
            height: 80px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .card.flip {
            transform: rotateY(180deg);
        }

        .card.matched {
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #00ff00); }
            to { filter: drop-shadow(0 0 20px #00ff00); }
        }

        .front, .back {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            backface-visibility: hidden;
            border: 2px solid #333;
        }

        .front {
            background: #22222d;
            transform: rotateY(180deg);
        }

        .back {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #00ffff;
            font-size: 1.5rem;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .back::after {
            content: "?";
            font-weight: bold;
        }

        /* --- Buttons --- */
        .restart-btn {
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        /* --- Win Message --- */
        .win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a24;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ff00;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.3);
            z-index: 100;
        }
        .win-message h2 {
            color: #00ff00;
            margin-top: 0;
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {
            .card { width: 65px; height: 65px; }
            .front { font-size: 2rem; }
            .game-board { gap: 10px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <h1>?? Memory Match</h1>
    
    <!-- NEW: Designer Credit moved to the top -->
    <div class="designer-credit">design <span>@Annasshakeel</span></div>

    <div class="stats">
        <div class="stat-box">Moves: <span id="moves">0</span></div>
        <div class="stat-box">Time: <span id="time">0</span>s</div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <button class="restart-btn" onclick="initGame()">Restart Game</button>

    <div class="win-message" id="winMessage">
        <h2>?? You Won! ??</h2>
        <p>Moves: <span id="finalMoves">0</span></p>
        <p>Time: <span id="finalTime">0</span>s</p>
        <button class="restart-btn" onclick="initGame()">Play Again</button>
    </div>

    <script>
        const gameBoard = document.getElementById('gameBoard');
        const movesDisplay = document.getElementById('moves');
        const timeDisplay = document.getElementById('time');
        const winMessage = document.getElementById('winMessage');
        
        // Emojis to use as card pairs
        const emojis = ['??', '??', '??', '??', '??', '??', '??', '??'];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;
        let timer;
        let seconds = 0;
        let gameStarted = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createBoard() {
            gameBoard.innerHTML = '';
            // Duplicate emojis to make pairs, then shuffle
            const deck = shuffle([...emojis, ...emojis]);
            
            deck.forEach(emoji => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;

                const front = document.createElement('div');
                front.classList.add('front');
                front.textContent = emoji;

                const back = document.createElement('div');
                back.classList.add('back');

                card.appendChild(front);
                card.appendChild(back);
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            // Start timer on first click
            if (!gameStarted) {
                gameStarted = true;
                timer = setInterval(() => {
                    seconds++;
                    timeDisplay.textContent = seconds;
                }, 1000);
            }

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesDisplay.textContent = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            matchedPairs++;
            
            resetBoard();

            if (matchedPairs === emojis.length) {
                clearInterval(timer);
                setTimeout(() => {
                    document.getElementById('finalMoves').textContent = moves;
                    document.getElementById('finalTime').textContent = seconds;
                    winMessage.style.display = 'block';
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function initGame() {
            clearInterval(timer);
            gameStarted = false;
            seconds = 0;
            moves = 0;
            matchedPairs = 0;
            timeDisplay.textContent = '0';
            movesDisplay.textContent = '0';
            winMessage.style.display = 'none';
            createBoard();
        }

        // Start the game on load
        initGame();
    </script>
</body>
</html>
